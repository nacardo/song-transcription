# Production stack for Unraid + Cloudflare Tunnel.
#
# Local dev on your Mac still uses ./docker-compose.yml (which builds the
# image locally). This file pulls a pre-built image from GHCR — no source
# checkout, no build tools, no `bun install` on the Unraid box.
#
# One-time setup on Unraid:
#   1. .env holds APP_PASSWORD, SESSION_SECRET, SESSION_HTTPS_ONLY=true,
#      TUNNEL_TOKEN, GHCR_IMAGE.
#   2. docker compose -f docker-compose.prod.yml pull
#   3. docker compose -f docker-compose.prod.yml up -d
#
# Ongoing:
#   - git push to main → GitHub Action builds + pushes to GHCR (~3 min)
#   - Watchtower polls every 5 min, pulls the new digest, restarts app
#   - Total lag from `git push` to deployed: ~5–10 min

services:
  app:
    image: ${GHCR_IMAGE}
    env_file:
      - .env
    volumes:
      - /mnt/user/appdata/song-transcription/data:/data
    networks:
      - tunnel
    restart: unless-stopped
    labels:
      # Watchtower only touches containers with this label enabled —
      # avoids surprising restarts of anything else on the Unraid box.
      com.centurylinklabs.watchtower.enable: "true"

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file:
      - .env  # provides TUNNEL_TOKEN
    networks:
      - tunnel
    depends_on:
      - app
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:latest
    # --label-enable pairs with the labels above so we're opt-in per service.
    # --cleanup removes the old image after a successful swap so
    # /mnt/user/appdata doesn't slowly fill up.
    # --interval 300 = poll every 5 min. Bump if you want less GHCR traffic.
    command: --interval 300 --cleanup --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  tunnel:
